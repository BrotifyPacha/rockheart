---
# Приватный ключ REALITY генерируется на сервере и никогда его не покидает
- name: Generate REALITY private key
  ansible.builtin.shell: |
    set -o pipefail
    umask 027
    /usr/local/bin/xray x25519 | awk -F': ' '/^Private ?[Kk]ey/ {print $2}' > reality.key
    test -s reality.key
    chgrp xray reality.key
  args:
    chdir: "{{ xray_config_dir }}"
    creates: "{{ xray_config_dir }}/reality.key"
    executable: /bin/bash

- name: Read REALITY private key
  ansible.builtin.slurp:
    src: "{{ xray_config_dir }}/reality.key"
  register: xray_reality_key_raw
  no_log: true

- name: Derive REALITY public key
  ansible.builtin.command: /usr/local/bin/xray x25519 -i {{ xray_reality_key_raw.content | b64decode | trim | quote }}
  register: xray_x25519_out
  changed_when: false
  check_mode: false
  no_log: true

# Новые версии печатают "Password (PublicKey):", старые "Public key:"
- name: Set REALITY keys
  ansible.builtin.set_fact:
    xray_reality_private_key: "{{ xray_reality_key_raw.content | b64decode | trim }}"
    xray_reality_public_key: >-
      {{ xray_x25519_out.stdout | regex_search('(?mi)^.*public ?key\)?:\s*(\S+)', '\1') | first }}
  no_log: true

# UUID, shortId и путь XHTTP генерируются один раз и хранятся в credentials/ (lookup сам создаёт каталоги с 0700)
- name: Build client credentials
  ansible.builtin.set_fact:
    xray_xhttp_path: "/{{ lookup('ansible.builtin.password', xray_credentials_dir ~ '/xhttp_path', length=16, chars=['ascii_lowercase', 'digits']) }}"
    xray_clients: >-
      {{ xray_clients | default([]) + [{
        'name': item,
        'id': lookup('ansible.builtin.password', xray_credentials_dir ~ '/users/' ~ item ~ '.seed', length=32, chars=['ascii_letters', 'digits']) | to_uuid,
        'short_id': lookup('ansible.builtin.password', xray_credentials_dir ~ '/users/' ~ item ~ '.sid', length=16, chars=['0123456789abcdef']),
      }] }}
  loop: "{{ xray_users }}"
  no_log: true
