---
- name: Write client files
  delegate_to: localhost
  become: false
  block:
    - name: Create client directories
      ansible.builtin.file:
        path: "{{ clients_output_dir }}/{{ item }}"
        state: directory
        mode: "0700"
      loop: "{{ xray_users }}"

    - name: Write client links
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', 'link.j2') | trim }}\n"
        dest: "{{ clients_output_dir }}/{{ item.0.name }}/{{ item.1 }}.txt"
        mode: "0600"
      loop: "{{ xray_clients | product(['xhttp', 'vision']) | list }}"
      loop_control:
        label: "{{ item.0.name }}/{{ item.1 }}"
      register: clients_link_files

    - name: Check for qrencode
      ansible.builtin.command: qrencode --version
      register: clients_qrencode
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Warn about missing qrencode
      ansible.builtin.debug:
        msg: qrencode not found on this machine, skipping QR codes (brew install qrencode / apt install qrencode)
      when: clients_qrencode.rc != 0

    - name: Render QR codes
      ansible.builtin.command:
        argv: [qrencode, -t, PNG, -s, "8", -o, "{{ item.dest | regex_replace('\\.txt$', '.png') }}", "{{ lookup('ansible.builtin.file', item.dest) }}"]
      loop: "{{ clients_link_files.results }}"
      loop_control:
        label: "{{ item.item.0.name }}/{{ item.item.1 }}"
      when:
        - clients_qrencode.rc == 0
        - item.changed or not (item.dest | regex_replace('\\.txt$', '.png')) is file
      changed_when: true

- name: Show client output location
  ansible.builtin.debug:
    msg: "Client links and QR codes: {{ clients_output_dir }}"
